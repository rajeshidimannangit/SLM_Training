[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-finetune"
version = "1.0.0"
description = "Enterprise local SLM fine-tuning with Unsloth (LoRA/QLoRA) and metrics CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SLM Finetuning Team" }]
dependencies = [
  "unsloth",
  "torch",
  "transformers>=4.45.0",
  "datasets>=2.19.0",
  "accelerate>=0.33.0",
  "peft>=0.12.0",
  "trl>=0.9.0",
  "bitsandbytes>=0.43.0",
  "mlflow>=2.14.0",
  "pyyaml>=6.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "evaluate>=0.4.2",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.4.0",
  "sqlalchemy>=2.0.0",
  "gradio>=4.44.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5.0"]

[project.scripts]
slm = "slm_finetune.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
