# Model profile for Google Colab (CUDA + Unsloth)
model:
  name_or_path: "unsloth/Llama-3.2-1B-Instruct"
  local_base_dir: "models/base"
  max_seq_length: 512
  dtype: null
  load_in_4bit: true
  trust_remote_code: false
  use_cache: false

finetuned:
  output_dir: "models/finetuned"
  adapter_name: "default_adapter"
  merge_and_save: false
