# Standard LoRA (no 4-bit quantization of base weights during train)
method: lora

lora:
  r: 8
  lora_alpha: 8
  lora_dropout: 0.0
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false
  loftq_config: null

quantization:
  load_in_4bit: false
  load_in_8bit: false
